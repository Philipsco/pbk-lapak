[build]
  publish = "public"
  command = "npm install"

[build.environment]
  NODE_VERSION = "24"

[functions]
  # Lokasi function hasil refactor dari server.js
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # pg butuh native/optional deps, external_node_modules memastikan
  # tidak ikut di-bundle ulang oleh esbuild
  external_node_modules = ["pg", "pg-native"]

# Redirect semua request /api/* ke Netlify Function "summon"
# (nama function = nama file summon.mjs tanpa ekstensi)
# app.js kamu memanggil `${window.location.origin}/api/...`
# jadi ini yang membuat endpoint tetap bekerja tanpa ubah app.js
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/summon/:splat"
  status = 200
  force = true

# (opsional) kalau frontend-mu Single Page App / butuh fallback routing,
# aktifkan redirect ini. Kalau cuma index.html statis biasa, boleh dihapus.
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  publish = "public"
  framework = "#custom"